<!-- Clock app HTML -->
<div class="app-interface" id="clock" style="top:300px; left:466px;">
    <div class="app-header">
        <span>⏰ Clock</span>
        <button onclick="closeApp('clock')">✕</button>
    </div>
    <div class="app-body clock-body">
        <div id="clock-time">00:00:00</div>
        <div id="clock-date">Loading date…</div>
        <div id="clock-theme">Waiting for time...</div>
    </div>
</div>
