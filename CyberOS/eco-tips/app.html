<!-- Eco Tips app HTML -->
<div class="app-interface" id="eco-tips" style="top:120px; left:480px;">
    <div class="app-header">
        <span>🌿 Eco Tips</span>
        <button onclick="closeApp('eco-tips')">✕</button>
    </div>
    <div class="app-body">
        <div id="eco-tip-text">Nature is the best teacher. Click "Next Tip" to explore sustainable ideas.</div>
        <div class="app-footer" style="display:flex; gap:12px; margin-top:14px;">
            <button onclick="showEcoTip()">Next Tip</button>
            <button onclick="copyEcoTip()">Copy Tip</button>
        </div>
    </div>
</div>
