<!-- Login Screen -->
<div id="login-screen" class="login-screen">
    <div class="login-container">
        <div class="login-avatar">👨‍💻</div>
        <h1 class="login-username">Admin</h1>
        <div class="login-input-group">
            <input 
                id="login-password" 
                type="password" 
                class="login-input" 
                placeholder="Enter password" 
                autocomplete="off"
            />
        </div>
        <button id="login-btn" class="login-button">Sign in</button>
        <div class="login-footer">Windows 11 Demo • May 2, 2026</div>
    </div>
</div>
