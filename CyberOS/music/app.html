<!-- Music app HTML -->
<div class="app-interface" id="music" style="top:320px; left:466px; max-width: 520px;">
    <div class="app-header">
        <span>🎧 Music Studio</span>
        <button onclick="closeApp('music')">✕</button>
    </div>
    <div class="app-body music-body">
        <div id="music-track">Now playing: Cyber Waves</div>
        <div id="music-status">Ready to play a synth tone.</div>
        <div class="app-footer">
            <button onclick="nextTrack()">Next Track</button>
            <button onclick="playTrack()">Play Tone</button>
        </div>
    </div>
</div>
